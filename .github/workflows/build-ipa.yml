name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  iphone:
    name: IPA iPhone seul
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate --spec project.yml

      - name: Compiler (sans signature)
        run: |
          xcodebuild \
            -project LynxDash.xcodeproj \
            -scheme LynxDash \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Créer l'IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LynxDash.app Payload/
          zip -qry LynxDash.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LynxDash-ipa
          path: LynxDash.ipa

  iphone-watch:
    name: IPA iPhone + Apple Watch
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate --spec project-watch.yml

      - name: Compiler (sans signature)
        run: |
          xcodebuild \
            -project LynxDash.xcodeproj \
            -scheme LynxDash \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Créer l'IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LynxDash.app Payload/
          ls Payload/LynxDash.app/Watch || echo "⚠️ app montre absente"
          zip -qry LynxDash-Watch.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LynxDash-Watch-ipa
          path: LynxDash-Watch.ipa
