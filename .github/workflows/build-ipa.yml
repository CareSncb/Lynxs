name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iphone:
    name: IPA iPhone seul
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate --spec project.yml

      - name: Compiler (sans signature)
        run: |
          xcodebuild \
            -project LynxDash.xcodeproj \
            -scheme LynxDash \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Signature ad-hoc avec le groupe d'apps (widgets / complication)
        run: |
          APP=build/Build/Products/Release-iphoneos/LynxDash.app
          ENT=Signing/app-group.entitlements
          find "$APP" -depth -name "*.appex" -type d -exec codesign -f -s - --entitlements "$ENT" {} \;
          if [ -d "$APP/Watch/LynxWatch.app" ]; then codesign -f -s - --entitlements "$ENT" "$APP/Watch/LynxWatch.app"; fi
          codesign -f -s - --entitlements "$ENT" "$APP"
          codesign -d --entitlements - "$APP" | head -20

      - name: Créer l'IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LynxDash.app Payload/
          zip -qry LynxDash.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LynxDash-ipa
          path: LynxDash.ipa

  iphone-watch:
    name: IPA iPhone + Apple Watch
    needs: iphone   # l'une après l'autre : évite d'attendre deux Mac en même temps
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate --spec project-watch.yml

      - name: Compiler (sans signature)
        run: |
          xcodebuild \
            -project LynxDash.xcodeproj \
            -scheme LynxDash \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Signature ad-hoc avec le groupe d'apps (widgets / complication)
        run: |
          APP=build/Build/Products/Release-iphoneos/LynxDash.app
          ENT=Signing/app-group.entitlements
          find "$APP" -depth -name "*.appex" -type d -exec codesign -f -s - --entitlements "$ENT" {} \;
          if [ -d "$APP/Watch/LynxWatch.app" ]; then codesign -f -s - --entitlements "$ENT" "$APP/Watch/LynxWatch.app"; fi
          codesign -f -s - --entitlements "$ENT" "$APP"
          codesign -d --entitlements - "$APP" | head -20

      - name: Créer l'IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LynxDash.app Payload/
          ls Payload/LynxDash.app/Watch || echo "⚠️ app montre absente"
          zip -qry LynxDash-Watch.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LynxDash-Watch-ipa
          path: LynxDash-Watch.ipa

  publish:
    name: Déposer les IPA dans la branche "ipa"
    needs: [iphone, iphone-watch]
    if: always() && needs.iphone.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publier
        run: |
          mkdir site && cd site
          find ../out -name "*.ipa" -exec cp {} . \;
          git init -q -b ipa
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "IPA ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ipa
