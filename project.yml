name: LynxDash
options:
  bundleIdPrefix: be.gyrocare
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
targets:
  LynxDash:
    type: application
    platform: iOS
    sources:
      - Sources
    scheme: {}
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: LynxDash
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: "LynxDash utilise le Bluetooth pour lire la télémétrie de ta gyroroue."
        UIBackgroundModes:
          - bluetooth-central
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.gyrocare.lynxdash
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
