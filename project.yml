name: LynxDash
options:
  bundleIdPrefix: be.gyrocare
  developmentLanguage: fr
  deploymentTarget:
    iOS: "18.0"
    watchOS: "10.0"
targets:
  LynxDash:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - SharedWidget
    scheme: {}
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: LynxDash
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations:
          - fr
          - nl
          - en
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: "LynxDash utilise le Bluetooth pour lire la télémétrie de ta gyroroue."
        UIBackgroundModes:
          - bluetooth-central
          - location
          - audio
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: "LynxDash enregistre le tracé GPS de tes trajets, gère les zones de bridage et envoie ta position à ton contact en cas de chute."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Permet d'enregistrer tes trajets, de gérer les zones de bridage et de détecter une chute même téléphone verrouillé."
        NSPhotoLibraryAddUsageDescription: "Pour enregistrer l'image de tes trajets."
        CFBundleURLTypes:
          - CFBundleURLName: be.gyrocare.lynxdash
            CFBundleURLSchemes:
              - lynxdash
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.gyrocare.lynxdash
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - target: LynxWidget
  LynxWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - SharedWidget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: LynxDash
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.gyrocare.lynxdash.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
